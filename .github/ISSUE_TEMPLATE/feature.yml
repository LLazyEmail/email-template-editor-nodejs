name: Feature request
description: A new endpoint or a change to an existing one.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What the editor (or another client) cannot do today.
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: Proposed API
      description: Method, path, request and response bodies, error cases.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable statements that define "done". They become the tests.
    validations:
      required: true
  - type: checkboxes
    id: frontend
    attributes:
      label: Frontend impact
      options:
        - label: Needs a matching change in email-template-editor-reactjs
