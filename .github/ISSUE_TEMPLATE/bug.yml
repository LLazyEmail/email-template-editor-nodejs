name: Bug report
description: An endpoint does not behave as documented in openapi.json.
labels: [bug]
body:
  - type: textarea
    id: request
    attributes:
      label: Request
      description: Method, path and body (a curl command is ideal).
      placeholder: |
        curl -X PATCH localhost:9000/tree/nodes/abc -H 'content-type: application/json' -d '{"title":"x"}'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected response
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual response
      description: Status, body and the requestId from the error, if any.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit or image tag, how it runs (npm run dev, Docker), relevant env vars.
