# Development: runs the API with hot reload against the local db.json
services:
  api:
    image: node:22-alpine
    command: sh -c "npm ci && npm run dev"
    working_dir: /app
    environment:
      NODE_ENV: development
      PORT: 9000
      DB_FILE: /app/db.json
      PUBLIC_DIR: /app/public
    ports:
      - 9000:9000
    volumes:
      - ./:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
